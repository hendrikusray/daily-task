    <ellipse cx="0" cy="-11" rx="6" ry="10" fill="rgba(228,188,40,0.74)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-11" rx="6" ry="10" fill="rgba(228,188,40,0.70)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-11" rx="6" ry="10" fill="rgba(228,188,40,0.74)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-11" rx="6" ry="10" fill="rgba(228,188,40,0.70)" transform="rotate(216)"/>
