    <ellipse cx="0" cy="-19" rx="10" ry="17" fill="rgba(218,72,138,0.72)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-19" rx="10" ry="17" fill="rgba(218,72,138,0.78)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-19" rx="10" ry="17" fill="rgba(218,72,138,0.72)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-19" rx="10" ry="17" fill="rgba(218,72,138,0.78)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-19" rx="10" ry="17" fill="rgba(218,72,138,0.72)" transform="rotate(300)"/>
