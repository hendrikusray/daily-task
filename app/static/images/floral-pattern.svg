  <ellipse cx="126" cy="90"  rx="4.5" ry="6" fill="rgba(228,112,48,0.63)"/>
  <ellipse cx="136" cy="97"  rx="4.5" ry="6" fill="rgba(228,112,48,0.60)"/>
  <ellipse cx="120" cy="100" rx="4"  ry="5.5" fill="rgba(228,112,48,0.57)"/>
  <ellipse cx="132" cy="108" rx="4"  ry="5.5" fill="rgba(228,112,48,0.54)"/>

