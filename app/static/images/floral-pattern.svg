  <circle cx="144" cy="22" r="4"   fill="rgba(182,148,212,0.64)"/>
  <circle cx="152" cy="29" r="3.5" fill="rgba(182,148,212,0.60)"/>
  <circle cx="140" cy="31" r="3.5" fill="rgba(182,148,212,0.57)"/>

  <!-- Small pink buds (bottom edge) -->
  <path d="M25,183 C19,172 30,165 35,176 C40,187 31,191 25,183 Z" fill="rgba(218,72,138,0.62)"/>
  <path d="M38,190 C32,179 43,172 48,183 C53,194 44,198 38,190 Z" fill="rgba(218,72,138,0.57)"/>

  <!-- Soft pink wash in center -->
  <ellipse cx="70" cy="115" rx="38" ry="28" fill="rgba(218,72,138,0.05)"/>
  <ellipse cx="138" cy="165" rx="32" ry="22" fill="rgba(68,178,148,0.05)"/>

