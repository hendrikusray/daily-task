  <g transform="translate(158,150)">
    <ellipse cx="0" cy="-14" rx="8" ry="12" fill="rgba(228,112,48,0.74)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-14" rx="8" ry="12" fill="rgba(228,112,48,0.70)" transform="rotate(72)"/>
