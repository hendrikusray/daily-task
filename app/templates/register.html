{% extends "base.html" %}

{% block title %}Daftar — Marianne Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-logo">
        <div class="auth-logo-mark">✿</div>
    </div>
    <h2>Buat Akun 🌸</h2>
    <p class="auth-subtitle">Mulai track campaign kamu sekarang</p>

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Pilih username unik..." autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="email@kamu.com" autocomplete="email" required>
        </div>
        <div class="form-group password-wrapper">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Buat password yang kuat..." autocomplete="new-password" required>
            <span class="password-toggle" onclick="togglePasswordVisibility('password')">👁️</span>
        </div>
        <div class="form-group password-wrapper">
            <label for="password_confirm">Konfirmasi Password</label>
            <input type="password" id="password_confirm" name="password_confirm" placeholder="Ulangi password..." autocomplete="new-password" required>
            <span class="password-toggle" onclick="togglePasswordVisibility('password_confirm')">👁️</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">
            Daftar Sekarang ✨
        </button>
    </form>

    <div class="auth-link">
        Sudah punya akun? <a href="{{ url_for('login') }}">Login di sini 💕</a>
    </div>
</div>
{% endblock %}
