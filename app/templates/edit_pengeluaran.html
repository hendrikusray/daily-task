{% extends "base.html" %}

{% block title %}Edit Pengeluaran — Marianne Tracker{% endblock %}

{% block content %}
<div class="form-container tracker-form-container">
    <div class="form-heading">
        <span class="eyebrow">✏️ Edit Pengeluaran</span>
        <h2>Edit Pengeluaran</h2>
    </div>

    <form method="POST" class="tracker-form">
        <div class="form-grid">

            <div class="form-group-full">
                <label for="tanggal">Tanggal 📅</label>
                <input type="text" id="tanggal" name="tanggal"
                       class="datepicker"
                       value="{{ item.tanggal.isoformat() }}"
                       placeholder="Pilih tanggal..." required>
            </div>

            <div class="form-group-full">
                <label for="kategori">Kategori 🏷️</label>
                <select id="kategori" name="kategori" required>
                    <option value="">— Pilih kategori —</option>
                    {% for option in category_options %}
                        <option value="{{ option }}" {% if item.kategori == option %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group-full wide-field">
                <label for="deskripsi">Deskripsi 📝</label>
                <input type="text" id="deskripsi" name="deskripsi"
                       value="{{ item.deskripsi or '' }}"
                       placeholder="Keterangan pengeluaran...">
            </div>

            <div class="form-group-full">
                <label for="jumlah">Jumlah (Rp) 💰</label>
                <input type="text" id="jumlah" name="jumlah"
                       value="{{ item.jumlah }}"
                       placeholder="500000" required>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">💾 Simpan Perubahan</button>
            <a href="{{ url_for('pengeluaran') }}" class="btn btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
